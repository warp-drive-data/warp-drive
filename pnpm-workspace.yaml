hoist: false

## We should consider removing these
## But historically this was the default for pnpm
## and there is cleanup to do to make things work
## without these
## Its also just useful to have these tools top-level
publicHoistPattern:
  - "*eslint*"
  - "*prettier*"

## Ideally this would be dynamic as in CI we only have 4 CPUs
## While locally we have 10-16 CPUs. The more CPUs we use during
## install, generally the faster the install will be.
childConcurrency: 10

## This is the default but its good to be explicit
## This helps us to ensure we are using the workspace
## version of a package.
saveWorkspaceProtocol: rolling

## The current default is "highest" but we want to be explicit
## Since we also just want to ensure we are always using the
## latest versions of things we can.
resolutionMode: highest

## This is documented in a slightly different place in the pnpm
## docs. If this setting is true (the default) then pnpm will
## run the pre* and post* versions of a script when running other
## scripts. For instance running "build" would also run "prebuild"
## and "postbuild". This is not the behavior we want.
enablePrePostScripts: false

## We use mise to manage our node and pnpm versions, so we do not
## want pnpm to manage these for us. (pnpm 12 renamed
## managePackageManagerVersions to initPackageManager.)
initPackageManager: false

## Make sure we don't troll ourselves when updating deps
verifyDepsBeforeRun: true

## pnpm 11 changed the default of autoInstallPeers from false to true.
## We do not want to auto-install peers because we want to ensure we
## understand what is actually required, so that if a consuming app
## uses strict mode things will work.
##
## This said, Apps should probably set this to true.
autoInstallPeers: false

## We want to error if we did not setup required peers correctly.
## However, this pnpm bug prevents us using this as it will error when
## using `--no-lockfile` without reporting any errors:
## https://github.com/pnpm/pnpm/issues/8382
strictPeerDependencies: false

## We use so many similarly grouped peers, we want to make the
## peer-groups easier to distinguish.
## This forces a shorter sha for all groups (vs the default of 1000)
peersSuffixMaxLength: 40
virtualStoreDirMaxLength: 40

## If a dependency is not declared, we do not want to accidentally
## resolve it from the workspace root. This is a common source of
## bugs in monorepos.
resolvePeersFromWorkspaceRoot: false

## Our Workspace Packages are "injected" so prevent devDependencies
## from being exposed and to allow for us to test optional
## peerDependencies.
injectWorkspacePackages: true

## This also means we do not want to hoist them to the root
## As this would both expose them to all other packages AND
## results in them using symlinks instead of hardlinks
hoistWorkspacePackages: false

## We use the `workspace:*` protocol for all workspace packages.
## In theory it would be nice to use `deep` here just in case we
## missed something so that we could tell pnpm to use the workspace
## version of a package if it exists. At any depth.
##
## However, it seems that deep/true result in workspace packages
## that are dependencies being symlinked instead of hardlinked more
## often, even at the top-level of a package, which is not what we
## want.
linkWorkspacePackages: false # deep

## Update injected dependencies when needed. This will rerun after
## various "build" scripts in our published packages.
##
## Unfortunately, this does not run after scripts in the monorepo
## root, so we have added a special "sync" script to handle this.
syncInjectedDepsAfterScripts:
  - build:pkg
  - sync

## In keeping with our "no hoisting" and "no auto-peers" and
## "isolated dep trees", we also want to avoid other things that
## lead to reliance on hoisting.
## In general, deduping leads to hoisting. This particular setting
## causes direct-dependencies to resolve from the workspace root if
## already in root. We don't want this.
dedupeDirectDeps: false

## We do not want to dedupe peer dependencies as this results in
## hoisting and violates optional peer isolation.
dedupePeerDependents: false

## We do not want to dedupe injected dependencies as this results in
## hoisting and violates optional peer isolation.
dedupeInjectedDeps: false

## Supply-chain hardening
##
## Newly published versions are not installable until they have existed
## for at least this many minutes. This gives the ecosystem time to detect
## and unpublish/deprecate compromised releases (e.g. from a hijacked
## maintainer account or leaked publish token) before we can pull them in,
## including as transitive dependencies.
##
## 10080 minutes = 7 days.
##
minimumReleaseAge: 10080

## Our own packages are published by our own release automation and are
## never installed from a public attacker's account, so there's no reason
## to delay picking up our own just-published releases (e.g. when the
## release tooling itself depends on a package it just published, or when
## verifying a release in CI immediately after publish).
##
minimumReleaseAgeExclude:
  - "@warp-drive/*"
  - "@ember-data/*"
  # Renovate security update: svgo@4.0.1 || 4.0.2
  - svgo@4.0.1 || 4.0.2
  # Renovate security update: @hono/node-server@1.19.13
  - "@hono/node-server@1.19.13"
  # Renovate security update: tmp@0.2.6
  - tmp@0.2.6
  # Renovate security update: turbo@2.9.14
  - turbo@2.9.14
  # Renovate security update: vite@7.3.2
  - vite@7.3.2
  # Renovate security update: @sveltejs/kit@2.57.1 || 2.69.1 || 2.70.2
  - "@sveltejs/kit@2.57.1 || 2.69.1 || 2.70.2"
  # Renovate security update: hono@4.12.25 || 4.12.34
  - hono@4.12.25 || 4.12.34
  # Renovate security update: morgan@1.11.0
  - morgan@1.11.0
  # Renovate security update: vitest@3.2.6
  - vitest@3.2.6
  # Renovate security update: svelte@5.55.7
  - svelte@5.55.7
  # One-off exclude to bump pnpm itself to 12.0.0 (released 2026-08-26,
  # still inside the 7-day window as of this change). Safe to drop once
  # 12.0.0 is more than 7 days old (~2026-09-02) since ordinary resolution
  # will pick it up anyway.
  - pnpm@12.0.0
  # Experimental adoption of TypeScript 7's native content-mapper mechanism
  # for .gts/.gjs type-checking (2026-08-29). Not a security update --
  # explicitly authorized by the repo owner.
  #
  # ember-content-mapper is brand new: every release that has an actual
  # implementation (0.1.0 and later) is inside the 7-day window, and the only
  # version old enough to clear it (0.0.0) is an empty placeholder stub, so
  # there is no gate-eligible version to adopt.
  #
  # The mapper hard-depends on `@glint/ember-tsc: ~1.11.0`, and the whole
  # 1.11.x line is likewise inside the window, as is ember-estree@0.8.0 which
  # @glint/ember-tsc@1.11.2 depends on. All three are required for the mapper
  # to be installable at all.
  #
  # Safe to drop once they age past the window (~2026-09-04).
  - ember-content-mapper@0.2.1
  - "@glint/ember-tsc@1.11.2"
  - ember-estree@0.8.0

## Prevents transitive (sub-)dependencies from being resolved via git,
## git+ssh, or raw tarball URLs. Only our own direct dependencies may use
## those protocols (none currently do); anything pulled in transitively
## must come from the registry, where it is subject to the release-age
## delay above and standard registry integrity checks.
##
blockExoticSubdeps: true

## Refuses to install a package version whose trust signals (e.g. npm
## provenance) have regressed compared to a version we've previously seen
## for it. A sudden drop in trust is a strong signal that a maintainer
## account or publish token has been compromised.
##
trustPolicy: no-downgrade

## Trust-downgrade checks are only meaningful for *recently* published
## versions, where a drop in provenance is a real signal of a hijacked
## account. For a version published long enough ago that the community
## would have already flagged an actual incident, a missing/weaker trust
## signal is far more likely to be inconsistent publish tooling (common
## for native-binary packages that ship per-platform builds, e.g.
## @oxc-parser's platform binaries) than an active compromise.
##
## 525600 minutes = 1 year -- long enough that "published a while ago"
## reliably means "aged past the danger window", rather than tying this to
## the much shorter minimumReleaseAge above, which is about delaying
## brand-new releases rather than judging whether a trust regression is
## still a meaningful signal.
##
trustPolicyIgnoreAfter: 525600

## hosted-git-info@6.1.3 (2024-11-21) is a transitive dependency of the
## frozen ember-cli@4.12.3 fixture used by the ember-lts-3.28 ember-try
## scenario. It never had provenance to begin with -- the "downgrade" is
## pnpm comparing it against a *later major* (7.x/8.x) that added
## provenance, not an actual regression within the 6.x line. See
## https://github.com/pnpm/pnpm/issues/10202. ember-cli@4.12.3 is a fixed,
## never-changing version, so this pin is safe to carry indefinitely. Now
## also covered by trustPolicyIgnoreAfter above regardless; kept explicit
## for documentation and in case the window is widened again later.
##
trustPolicyExclude:
  - hosted-git-info@6.1.3
  ## @embroider/config-meta-loader@1.0.1-unstable.f9c81e9 (2025-03-14) is
  ## pinned exactly across several tests/* fixtures. The "downgrade" is
  ## pnpm comparing it against a *later, unrelated* 1.0.0 release
  ## (2025-04-03) that added provenance -- not a regression within this
  ## "-unstable" prerelease line, which never had provenance to begin with.
  ## Same pnpm/pnpm#10202 false positive as hosted-git-info@6.1.3 above.
  ## Now also covered by trustPolicyIgnoreAfter above regardless; kept
  ## explicit for documentation and in case the window is widened again
  ## later.
  - "@embroider/config-meta-loader@1.0.1-unstable.f9c81e9"
  ## undici-types@6.21.0 (2024-11-13) is a transitive dependency of
  ## @types/node -- effectively unpinnable directly, since it's whatever
  ## @types/node@<major> happens to require. It never had provenance; the
  ## 6.x line resumed publishing after a ~14 month gap (6.23.0, 2026-01-05)
  ## and added provenance then. Same pnpm/pnpm#10202 false positive as the
  ## entries above: pnpm compares against later releases (here, even later
  ## releases within the *same* 6.x line) regardless of whether provenance
  ## was ever a realistic expectation for the version actually being
  ## installed. Now also covered by trustPolicyIgnoreAfter above
  ## regardless; kept explicit for documentation and in case the window is
  ## widened again later.
  - undici-types@6.21.0
  ## @trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1 (2025-12-02) is a
  ## hard dependency of workbox-build@7.4.1 (pulled in transitively via
  ## vite-plugin-pwa). The maintainer published 2.5.0 with npm provenance,
  ## then 3.0.0-pre1 without it ~31 minutes later the same day -- likely a
  ## manual publish outside their provenance-enabled release pipeline for the
  ## stable line, not a compromise. npm's prerelease caret-range matching
  ## means workbox-build's `^3.0.0-pre1` dependency can only ever resolve to
  ## this exact version, so there is no newer trusted version to fall back
  ## to. Scoped to this exact version only; revisit if workbox-build ever
  ## bumps its declared range.
  - "@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1"

packages:
  - "packages/*"
  - "tools/*"
  - "release"
  - "warp-drive-packages/*"
  - "docs-viewer"
  - "!docs-viewer/projects/*"
  - "tests/*"
  - "specs"

## Single source of truth for devDependency versions that are duplicated
## across many workspace packages. Package.json entries reference these via
## "catalog:" instead of a hardcoded version so there's only one place to
## bump, and pnpm resolves every consumer to the exact same version instead
## of letting per-package ranges drift apart.
catalog:
  ember-source: ~7.2.0
  vite: ^8.2.2
  "@types/node": ^26.3.0

## The following settings previously lived under the root package.json's
## "pnpm" field. pnpm 11 no longer reads that field -- these all moved here.
packageExtensions:
  vitepress-plugin-group-icons:
    peerDependencies:
      vite: "*"
  typedoc-vitepress-theme:
    peerDependencies:
      typedoc: "*"
  "@glimmer/syntax":
    dependencies:
      "@glimmer/env": ^0.1.7
  ember-page-title:
    peerDependencies:
      "@glimmer/component": "*"
      ember-source: "*"
  ember-source:
    peerDependencies:
      "@glimmer/component": "*"

overrides:
  "@embroider/macros": ^1.20.6
  ember-auto-import: ^2.13.1
  "@embroider/addon-shim>broccoli-funnel": "-"
  ember-cli-babel>broccoli-funnel: "-"
  qunit-console-grouper>broccoli-funnel: "-"
  broccoli-merge-trees: ^4.2.0
  "@glimmer/validator": ^0.95.0
  "@glint/ember-tsc": 1.11.2
  "@glint/template": 1.8.0
  ember-cli-babel: ^8.3.2
  "@embroider/macros>ember-cli-babel": "-"
  ember-source>ember-cli-babel: "-"
  ember-source>broccoli-file-creator: "-"
  ember-source>ember-cli-get-component-path-option: "-"
  ember-source>ember-cli-normalize-entity-name: "-"
  ember-source>ember-cli-path-utils: "-"
  ember-source>ember-cli-string-utils: "-"
  ember-source>ember-cli-typescript-blueprint-polyfill: "-"
  ember-source>ember-cli-version-checker: "-"
  "@ember/optional-features>ember-cli-version-checker": "-"
  unplugin>webpack-virtual-modules: "-"
  ember-cli-htmlbars: ^7.0.1
  qunit: 2.26.0
  ember-compatibility-helpers: ^1.2.7
  testem: ~3.20.2
  typescript: 6.0.3
  "@types/bun": 1.4.0
  bun-types: 1.4.0
  lodash: ^4.18.1
  caniuse-lite: ^1.0.30001810
  rollup: ^4.63.0
  "@babel/types": ^7.29.8
  "@babel/parser": ^7.29.8
  "@babel/traverse": ^7.29.8
  prettier: ^3.9.6
  "@types/node": "catalog:"
  "@vue/compiler-sfc": 3.5.41
  "@shikijs/langs": 4.4.3
  string.prototype.matchall: npm:@nolyfill/string.prototype.matchall@^1.0.44

peerDependencyRules:
  ignoreMissing:
    - rsvp
    - "@glimmer/component"
    - search-insights
    - "@pnpm/logger"
    - "@algolia/client-search"
  allowAny:
    - ember-source
    - "@glimmer/component"
    - typescript
    - "@pnpm/logger"

allowUnusedPatches: true

patchedDependencies:
  qunit@2.19.4: patches/qunit@2.19.4.patch
  testem@3.11.0: patches/testem@3.11.0.patch
  "@ember/test-helpers@3.3.0": patches/@ember__test-helpers@3.3.0.patch
  "@ember/test-helpers@4.0.4": patches/@ember__test-helpers@4.0.4.patch
  "@ember/test-helpers@5.1.0": patches/@ember__test-helpers@5.1.0.patch
  "@ember/test-helpers@5.2.0": patches/@ember__test-helpers@5.2.0.patch
  ember-source@4.4.5: patches/ember-source@4.4.5.patch
  ember-source@3.28.12: patches/ember-source@3.28.12.patch
  "@ember/test-helpers@5.4.3": patches/@ember__test-helpers@5.4.3.patch

## pnpm 11 requires explicit opt-in for dependency postinstall/build scripts.
## unrs-resolver (native resolver used transitively by eslint-import-context)
## is a well-known, widely-used package; its postinstall just fetches the
## prebuilt native binary for the current platform.
allowBuilds:
  unrs-resolver: true
