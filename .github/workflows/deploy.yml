# Builds the docs from `main` and publishes them to https://canary.warp-drive.io as the
# production deployment of the `warp-drive-docs` Cloudflare Pages project.
#
# Per-PR previews are the other half of this setup: see docs-preview-build.yml and
# docs-preview-deploy.yml, which publish to the same project as preview deployments.
#
# Cloudflare Pages keeps every deployment as its own immutable snapshot, so unlike the
# gh-pages branch this replaced, nothing accumulates in a single artifact and there is no
# whole-site size limit to hit; the limits that remain are per deployment (see
# scripts/docs-deploy/check-dist.sh).
name: canary.warp-drive.io deployment

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

# Only the latest commit on main matters; a newer push supersedes an in-flight deploy.
concurrency:
  group: docs-production
  cancel-in-progress: true

env:
  TURBO_API: http://127.0.0.1:9080
  TURBO_TOKEN: this-is-not-a-secret
  TURBO_TEAM: myself

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          install: true
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG == 'true' }}
          DISABLE_TURBO_CACHE: ${{ secrets.ACTIONS_RUNNER_DEBUG == 'true' }}
      - name: Build docs
        run: pnpm run build
        working-directory: docs-viewer
        env:
          BASE: ''
          HOSTNAME: 'https://canary.warp-drive.io'
          # authenticates the docs build's calls to api.github.com (contributor list +
          # profile lookups) so they get the 5,000/hour per-token limit instead of the
          # 60/hour per-IP anonymous limit, which is shared with unrelated jobs across
          # the whole GitHub Actions runner pool and fails intermittently under load
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check build output
        run: scripts/docs-deploy/check-dist.sh docs-viewer/docs.warp-drive.io/.vitepress/dist
      - name: Deploy to Cloudflare Pages
        run: >
          npx --yes wrangler@4 pages deploy docs-viewer/docs.warp-drive.io/.vitepress/dist
          --project-name warp-drive-docs
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
