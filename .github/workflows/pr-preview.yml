# Publishes a docs preview per pull request to
# https://canary.warp-drive.io/pr-preview/pr-<number>/ (`deploy` job) and takes it
# down again (`remove` job). Each job has one job-level `if:`; no step is conditional.
#
# This targets the `gh-pages` branch directly (via rossjrw/pr-preview-action, which
# namespaces each PR under pr-preview/pr-<number>/ on that branch) rather than the
# "GitHub Actions" Pages build type that .github/workflows/deploy.yml used to use --
# that type publishes one atomic, whole-site artifact per run, which can't host
# per-PR subfolders alongside the production deploy. See deploy.yml for the
# production side of this same gh-pages branch.
#
# BASE is root-relative (no /warp-drive/ prefix) to match deploy.yml's BASE=''
# for production -- both assume the canary.warp-drive.io custom domain, which
# deploy.yml binds via a CNAME file at the branch root, as the canonical way this
# site is served.
#
# NOTE: for this to work, this repository's Settings > Pages > "Build and
# deployment" source must be set to "Deploy from a branch" (gh-pages / root),
# not "GitHub Actions".
#
# Gated to PRs labeled ":label: feat", ":label: doc", or ":label: rfc" (this repo's
# actual label names -- see enforce-pr-labels-canary.yml): most PRs don't touch the
# docs, and building the whole site isn't free. `labeled`/`unlabeled` are included
# so a preview appears as soon as one of those labels is added (not just on the
# next push) and gets torn down if the label is later removed.
#
# Fork PRs are excluded: their token is read-only, so neither job could push to
# gh-pages or comment.
#
# A docs PR closed while it has a merge conflict never fires `closed` (GitHub does
# not run pull_request workflows for conflicting PRs); pr-preview-sweep.yml removes
# those previews.
name: docs PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]

permissions:
  contents: write
  pull-requests: write

env:
  TURBO_API: http://127.0.0.1:9080
  TURBO_TOKEN: this-is-not-a-secret
  TURBO_TEAM: myself

jobs:
  deploy:
    if: |
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.state == 'open'
      && (
        (
          contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action)
          && (contains(github.event.pull_request.labels.*.name, ':label: feat') || contains(github.event.pull_request.labels.*.name, ':label: doc') || contains(github.event.pull_request.labels.*.name, ':label: rfc'))
        )
        || (
          github.event.action == 'labeled'
          && contains(fromJSON('[":label: feat", ":label: doc", ":label: rfc"]'), github.event.label.name)
        )
      )
    runs-on: ubuntu-latest
    concurrency:
      group: pr-preview-${{ github.event.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          install: true
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG == 'true' }}
          DISABLE_TURBO_CACHE: ${{ secrets.ACTIONS_RUNNER_DEBUG == 'true' }}
      - name: Build docs
        run: pnpm run build
        working-directory: docs-viewer
        env:
          BASE: /pr-preview/pr-${{ github.event.number }}/
          HOSTNAME: https://canary.warp-drive.io
          # see the matching comment on `pwa` in config.mts
          DISABLE_PWA: 'true'
          # see the matching comment in deploy.yml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          action: deploy
          source-dir: docs-viewer/docs.warp-drive.io/.vitepress/dist
          # matches the custom domain deploy.yml binds via its `cname` input, so the
          # sticky PR comment/QR code link to the URL that actually works, not the
          # default <owner>.github.io/<repo>/ path (which BASE above doesn't target).
          # No scheme here -- the action's own preview_url output is literally
          # "https://$pages_base_url/...", so including "https://" in this input
          # doubles up into "https://https://..." in the posted comment/QR code.
          pages-base-url: canary.warp-drive.io

  remove:
    if: |
      github.event.pull_request.head.repo.full_name == github.repository
      && (
        (
          github.event.action == 'closed'
          && (contains(github.event.pull_request.labels.*.name, ':label: feat') || contains(github.event.pull_request.labels.*.name, ':label: doc') || contains(github.event.pull_request.labels.*.name, ':label: rfc'))
        )
        || (
          github.event.action == 'unlabeled'
          && github.event.pull_request.state == 'open'
          && contains(fromJSON('[":label: feat", ":label: doc", ":label: rfc"]'), github.event.label.name)
          && !(contains(github.event.pull_request.labels.*.name, ':label: feat') || contains(github.event.pull_request.labels.*.name, ':label: doc') || contains(github.event.pull_request.labels.*.name, ':label: rfc'))
        )
      )
    runs-on: ubuntu-latest
    concurrency:
      group: pr-preview-${{ github.event.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Remove preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          action: remove
