name: Setup Test Environment
description: Composable Action for ensuring speedy test setup

inputs:
  ## Disables TurboCache
  DISABLE_TURBO_CACHE:
    description: Whether to disable TurboCache
    required: false
    default: false
  ACTIONS_RUNNER_DEBUG:
    description: Whether to enable debug mode
    required: false
    default: false
  ## Speeds Up Lint by enabling reuse
  restore-lint-caches:
    description: Whether to restore lint caches
    required: false
    default: false
  ## Speeds Up Build of bigger apps by enabling reuse
  restore-broccoli-cache:
    description: Whether to restore broccoli
    required: false
    default: false
  use-production-caches:
    description: Whether to restore from production caches
    required: false
    default: false
  install:
    description: Whether to install dependencies
    required: false
    default: false
  skip-addon-build:
    description: Whether to skip the prepare step for in-repo v2 addons when running pnpm install
    required: false
    default: false
  adtl-install-args:
    description: additional args to pass to pnpm install
    required: false
    default: ''
  parallel-build:
    description: Whether to build in parallel
    required: false
    default: true
  ## Set to same as number of cores
  ## 2 for ubuntu-latest (default)
  jobs:
    description: How many Build Jobs to Run
    required: false
    default: 4
  ref:
    description: Ref to Setup
    required: false
    default: ${{ github.sha }}
  repo-token:
    description: Token to use for TurboRepo
    required: false
    default: ''
  with-cert:
    description: Whether to setup an SSL Cert
    required: false
    default: false

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        registry-url: 'https://registry.npmjs.org'
        node-version: 25.5
        cache: 'pnpm'

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: latest

    - name: DEBUG STATUS
      shell: bash
      run:
        echo "DISABLE_TURBO_CACHE = ${{ inputs.DISABLE_TURBO_CACHE }}"
        echo "ACTIONS_RUNNER_DEBUG = ${{ inputs.ACTIONS_RUNNER_DEBUG }}"
        echo "restore-lint-caches = ${{ inputs.restore-lint-caches }}"
        echo "restore-broccoli-cache = ${{ inputs.restore-broccoli-cache }}"

    # felixmosh/turborepo-gh-artifacts' local proxy server (below) serves a
    # GET for artifact <id> straight from ${RUNNER_TEMP}/turbo-cache/<id>.gz
    # on disk with zero network calls when that file already exists --  it
    # only falls back to querying the GitHub Artifacts API when it's missing
    # locally (see felixmosh/turborepo-gh-artifacts's turboServer.ts). That
    # API-based fallback path is the one that's proven unreliable across
    # separate jobs/workflow runs (see the note on `permissions` in
    # .github/workflows/main.yml). Pre-seeding this directory from a shared
    # actions/cache entry means most GETs hit the instant, reliable local
    # path instead, for jobs both within this workflow run and in later ones.
    #
    # This must be placed *before* the felixmosh step: composite/JS action
    # "post" cleanup steps run in the *reverse* order their main steps were
    # registered, and felixmosh's own post step is what moves this run's
    # newly-built artifacts from turbo-cache/new-artifacts/ into the flat
    # turbo-cache/<id>.gz layout the GET handler reads from (see
    # felixmosh/turborepo-gh-artifacts's uploadArtifacts.ts). Registering our
    # restore first means our save (its own post step) runs *after*
    # felixmosh's, capturing that final, fully-populated state rather than
    # a snapshot from before this run's artifacts were moved into place.
    #
    # The key is unique per run (so a save always has something new to
    # write -- actions/cache entries are immutable once created, an
    # already-existing key is silently skipped) with a prefix-matched
    # restore-key so every run still starts from the most recently saved
    # state regardless of which prior run wrote it.
    - name: 'Restore Turbo Remote-Cache Proxy Disk Cache'
      if: ${{ inputs.repo-token }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/turbo-cache
        key: turbo-remote-cache-${{ github.run_id }}
        restore-keys: |
          turbo-remote-cache-

    # Main, DX (blueprint-tests.yml), and Compat (compat-tests.yml) all trigger
    # on the same `pull_request` event, so a single push starts several
    # independent workflow *runs* -- each with its own `github.run_id` -- that
    # each run their own `install` job and redundantly rebuild the same
    # `build:pkg` outputs from scratch. Worse, since they're mutually unaware
    # of each other, more than one can decide "cache miss" and upload an
    # artifact under the *same* content-derived hash name around the same
    # time; GitHub's artifact store has no cross-run dedup, so this produces
    # two distinct, coexisting artifacts sharing one name -- which is what was
    # actually causing build:pkg's remote-cache corruption, not (only) list-API
    # lag. `build:pkg`'s hash is purely a function of file contents, so it is
    # identical across all three workflows for the same commit -- confirmed
    # directly (hash `97e7b03c5739bcf2` computed identically by both the Main
    # and DX runs of the same push).
    #
    # Turborepo always checks its own local on-disk cache (`.turbo/cache`)
    # before ever consulting the remote (felixmosh) cache, so persisting that
    # directory here -- keyed by commit, not by run -- lets every workflow's
    # `install` job satisfy `build:pkg` from a plain, well-tested actions/cache
    # restore, without any of the three ever needing to ask the flaky
    # remote-cache proxy at all. Whichever job computes it first wins the
    # exact key (a hit skips the redundant work and the no-op re-save); the
    # prefix-matched restore-key still gives partial reuse for unchanged
    # packages across commits.
    - name: 'Restore Turbo Local Build Cache'
      if: ${{ inputs.install == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-local-cache-${{ github.sha }}
        restore-keys: |
          turbo-local-cache-

    # Vendored, patched copy of felixmosh/turborepo-gh-artifacts@v4.1.1 -- its
    # artifact-existence check does a single unretried call to GitHub's
    # list-artifacts endpoint, which can lag a few seconds behind a
    # just-finalized upload and report a false "not found". See
    # .github/actions/turborepo-gh-artifacts/VENDORED.md for the patch and
    # the plan to drop this once it's merged upstream.
    - name: 'Setup local TurboRepo server'
      if: ${{ inputs.repo-token }}
      uses: ./.github/actions/turborepo-gh-artifacts
      with:
        repo-token: ${{ inputs.repo-token }}

    - name: 'Setup SSL Cert Infra'
      if: ${{ inputs.with-cert == 'true' }}
      shell: bash
      # We only need the mkcert binary itself, so we install it directly from
      # its GitHub release instead of via Homebrew. The runner image ships
      # Homebrew preinstalled, but the setup-homebrew action still ran a full
      # `brew update` (git-fetching Homebrew/brew + refreshing the formula
      # index) before `brew install mkcert` could run, costing ~20s per job
      # for a stable, rarely-updated formula. Pinning the version + verifying
      # its checksum keeps this at least as trustworthy as the Homebrew path.
      run: |
        sudo apt-get -y update
        sudo apt-get -y install libnss3-tools

        MKCERT_VERSION=v1.4.4
        MKCERT_SHA256=6d31c65b03972c6dc4a14ab429f2928300518b26503f58723e532d1b0a3bbb52
        curl -fsSL -o /tmp/mkcert "https://github.com/FiloSottile/mkcert/releases/download/${MKCERT_VERSION}/mkcert-${MKCERT_VERSION}-linux-amd64"
        echo "${MKCERT_SHA256}  /tmp/mkcert" | sha256sum -c -
        chmod +x /tmp/mkcert
        sudo mv /tmp/mkcert /usr/local/bin/mkcert

    - name: 'Setup DBus for Chrome'
      shell: bash
      run: |
        echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus" >> $GITHUB_ENV

    - name: Configure Parallel Builds
      if: ${{ inputs.parallel-build == 'true' }}
      shell: bash
      run: |
        echo "JOBS=${{ inputs.jobs }}" >> $GITHUB_ENV
        echo "THROW_UNLESS_PARALLELIZABLE=1" >> $GITHUB_ENV

    - name: Install Dependencies
      if: ${{ inputs.install == 'true' && inputs.skip-addon-build == 'false' }}
      shell: bash
      run: pnpm install --prefer-offline $ADTL_ARGS
      env:
        ADTL_ARGS: ${{ inputs.adtl-install-args }}
        TURBO_FORCE: ${{ inputs.DISABLE_TURBO_CACHE == 'true' }}

    - name: Install Dependencies w/o Addon Builds
      if: ${{ inputs.install == 'true' && inputs.skip-addon-build == 'true' }}
      shell: bash
      run: pnpm install --prefer-offline --ignore-scripts $ADTL_ARGS
      env:
        ADTL_ARGS: ${{ inputs.adtl-install-args }}

    # TEMPORARY diagnostic for the build:pkg missing-babel-macros investigation.
    # Prints what's actually on disk right after install/build:pkg, both at the
    # real path and through a downstream package's node_modules symlink, so we
    # can see directly whether the file is missing at the source or only
    # unreachable through the symlink. Remove once root-caused.
    - name: 'DEBUG: inspect @warp-drive/core build-config output'
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: |
        echo "--- real dir: warp-drive-packages/core/dist/build-config ---"
        ls -la warp-drive-packages/core/dist/build-config/ 2>&1 || echo "MISSING DIR"
        echo
        echo "--- packages/graph/node_modules/@warp-drive/core symlink ---"
        ls -la packages/graph/node_modules/@warp-drive/ 2>&1 || echo "MISSING @warp-drive dir"
        readlink -f packages/graph/node_modules/@warp-drive/core 2>&1 || echo "not a symlink or missing"
        echo
        echo "--- same file, via the symlink ---"
        ls -la packages/graph/node_modules/@warp-drive/core/dist/build-config/ 2>&1 || echo "MISSING via symlink"
        echo
        echo "--- mtimes: real file vs directory vs package.json ---"
        stat -c '%Y %n' warp-drive-packages/core/dist/build-config/babel-macros.js warp-drive-packages/core/dist/build-config warp-drive-packages/core/package.json 2>&1 || true

    - name: 'Generate SSL Cert'
      if: ${{ inputs.with-cert == 'true' }}
      shell: bash
      # Generates the cert if needed, using our local copy of @warp-drive/holodeck
      run: |
        node ./packages/holodeck/server/ensure-cert.js

    - name: Setup Broccoli Caching
      if: ${{ inputs.restore-broccoli-cache == 'true' }}
      shell: bash
      run: |
        echo "FORCE_PERSISTENCE_IN_CI=true" >> $GITHUB_ENV
        echo "BROCCOLI_PERSISTENT_FILTER_CACHE_ROOT=${{ github.workspace }}/.broccoli-cache" >> $GITHUB_ENV

    - name: Restore Broccoli Cache
      if: ${{ inputs.restore-broccoli-cache == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ github.workspace }}/.broccoli-cache
          node_modules/.cache
          tests/dont-write-new-tests-here/node_modules/.cache
        key: broccoli${{inputs.use-production-caches == 'true' && '-production-' || '-'}}${{ github.head_ref }}-${{inputs.ref }}
        restore-keys: |
          broccoli${{inputs.use-production-caches == 'true' && '-production-' || '-'}}${{ github.head_ref }}
          broccoli${{inputs.use-production-caches == 'true' && '-production-' || '-'}}${{ github.base_ref }}
          broccoli${{inputs.use-production-caches == 'true' && '-production-' || '-'}}main

    - name: Restore Lint Caches
      if: ${{ inputs.restore-lint-caches == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Type-check (tsconfig.tsbuildinfo) and lint (.eslintcache) artifacts are
        # produced per-package by turbo rather than at the repo root, so these
        # paths must be globbed to cover every workspace package. Prettier still
        # runs once from the repo root, so `.prettier-cache` stays un-globbed.
        path: |
          .prettier-cache
          **/.eslintcache
          **/tsconfig.tsbuildinfo
        key: lint-${{ github.head_ref }}-${{ inputs.ref }}
        restore-keys: |
          lint-${{ github.head_ref }}
          lint-${{ github.base_ref }}
          lint-main
